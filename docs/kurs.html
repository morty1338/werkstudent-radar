<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All jobs · Werkstudent Radar</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://morty1338.github.io/werkstudent-radar/?mode=jobs">
  <!-- The old "All jobs" page is now the main page in Jobs mode. Old links keep working:
       ?a=<academy>&t=<job title>&lang= become its filters. -->
  <script>
    (() => {
      const p = new URLSearchParams(location.search);
      const to = new URLSearchParams({ mode: "jobs" });
      for (const [from, key] of [["a", "academy"], ["t", "field"], ["lang", "lang"]]) if (p.get(from)) to.set(key, p.get(from));
      location.replace(`index.html?${to}${location.hash}`);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=index.html?mode=jobs"></noscript>
  <style>body { background: #0B0B0C; color: #F2F0EA; font: 16px system-ui, sans-serif; } a { color: #FFC247; }</style>
</head>
<body>
  <p><a href="index.html?mode=jobs">All jobs: Werkstudent Radar in Jobs mode</a></p>
</body>
</html>
