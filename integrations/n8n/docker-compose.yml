# n8n for the Telegram alerts on your own computer, reachable from GitHub Actions through
# ngrok's free fixed domain. Setup: README.md in this folder. Start: docker compose up -d
services:
  n8n:
    image: n8nio/n8n:2.43.4                # the version the workflow was tested with
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"                   # the editor, only on this computer
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - WEBHOOK_URL=https://${NGROK_DOMAIN}/    # so n8n shows the public production URL
      - N8N_PROXY_HOPS=1
      - N8N_DIAGNOSTICS_ENABLED=false
      # "Check signature" needs Node's crypto module and $env.WEBHOOK_SECRET.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n                # workflows, credentials, executions

  ngrok:
    image: ngrok/ngrok:3.39.11-alpine
    restart: unless-stopped
    command: http n8n:5678 --url=https://${NGROK_DOMAIN} --traffic-policy-file=/etc/ngrok-policy.yml
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok-policy.yml:/etc/ngrok-policy.yml:ro
    depends_on:
      - n8n

volumes:
  n8n_data:
