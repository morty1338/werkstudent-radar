name: Deploy MCP server

# Tests the MCP server, builds its container image (mcp/Dockerfile) and checks it,
# then deploys the server to Vercel (free Hobby plan, no payment method) when it
# changes on main. Only the server goes out (mcp/vercel/stage.sh), not the website.
# The deploy job waits until the repository secret VERCEL_TOKEN exists
# (Settings → Secrets and variables → Actions); see mcp/DEPLOY.md. Failing steps
# repeat their last output lines as annotations (.github/scripts/run_logged.sh),
# which anyone can read for a public repository, unlike the logs.

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - "radar/stats.py"
      - "tests/test_mcp*.py"
      - ".github/workflows/mcp-deploy.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: mcp-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: radar-mcp        # the Vercel project; its address is https://<project>.vercel.app
  VERCEL_CLI: vercel@61.1.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the MCP tests
        run: bash .github/scripts/run_logged.sh "MCP tests" python -m pytest -q tests/test_mcp.py tests/test_mcp_http.py

      # The image the host will run, started as the host would: own port, a foreign
      # Host header, no data inside (it reads the published JSON).
      - name: Build and check the container
        run: |
          docker build -f mcp/Dockerfile -t radar-mcp .
          docker run -d --name radar-mcp -p 8080:8080 radar-mcp
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors -H "Host: radar-mcp.example.run.app" http://localhost:8080/health
          python - <<'EOF'
          import anyio
          from mcp import Client

          async def main():
              async with Client("http://localhost:8080/mcp") as c:
                  r = await c.call_tool("get_overview", {})
                  assert not r.is_error and r.structured_content["postings"] > 0, r
                  print("get_overview:", r.structured_content["postings"], "postings on", r.structured_content["as_of"])

          anyio.run(main)
          EOF
          docker logs radar-mcp
          docker rm -f radar-mcp

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Wait for the Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN isn't set yet, so nothing is deployed (see mcp/DEPLOY.md)."

      - uses: actions/checkout@v7
        if: env.VERCEL_TOKEN != ''

      # mcp/vercel/deploy.sh: creates the project on the first run, deploys only the
      # server (staged outside the checkout) as production, finds the production address.
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: bash .github/scripts/run_logged.sh "Deploy to Vercel" bash mcp/vercel/deploy.sh

      - name: Check the deployed server
        if: env.VERCEL_TOKEN != ''
        run: |
          bash .github/scripts/run_logged.sh "Check the deployed server" \
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$MCP_URL/health"
          echo "### MCP server deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Connect Claude to \`$MCP_URL/mcp\`" >> "$GITHUB_STEP_SUMMARY"
