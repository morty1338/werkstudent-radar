name: Daily data update

on:
  schedule:
    # 04:23 UTC = 06:23 in Berlin (05:23 in winter). Off the full hour, when
    # GitHub's scheduler is busiest and runs get delayed or dropped.
    - cron: "23 4 * * *"
    # Catch-up run: GitHub doesn't guarantee scheduled runs and sometimes
    # skips one. This run only does the work if the morning one didn't.
    - cron: "23 16 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the new data
  issues: write     # open an issue when the run fails

concurrency:
  group: daily-data
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Decide whether today's data still has to be collected. Only the afternoon
  # catch-up run checks; a second full run on the same day would also keep
  # postings removed during the day as "online today".
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: data/history.csv
          sparse-checkout-cone-mode: false

      - id: today
        name: Is today's data already in?
        run: |
          today=$(TZ=Europe/Berlin date +%F)
          if [ "${{ github.event.schedule }}" = "23 16 * * *" ] && grep -q "^${today}," data/history.csv; then
            echo "Data for ${today} is already in; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set log path
        run: echo "LOG=$RUNNER_TEMP/pipeline.log" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Font for the social preview image (usually preinstalled on the runner;
      # without it the image falls back to Pillow's font and writes "EUR").
      - name: Make sure DejaVu fonts are installed
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core || true

      - name: Collect postings
        run: python -m radar.collect 2>&1 | tee -a "$LOG"

      # Second source. If it fails, the day still works with the Bundesagentur's
      # data, and enrich keeps recently seen career-site postings.
      - name: Collect company career sites (Arbeitnow)
        continue-on-error: true
        run: python -m radar.arbeitnow 2>&1 | tee -a "$LOG"

      - name: Extract features from new postings
        run: python -m radar.enrich 2>&1 | tee -a "$LOG"

      # Skills and requirements of new or changed postings by Claude Haiku, as one
      # Message Batch (half price); results in data/history/llm*.csv, keyed by a hash
      # of the text so nothing is sent twice. Without the secret, on API errors or a
      # batch that isn't done in time, the rules' results stand (a late batch is
      # collected by the next run); this step never fails the run.
      - name: Extract skills with Claude Haiku (new postings only)
        continue-on-error: true
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MAX_POSTINGS: "1000"   # per run, newest first; the rest waits for later runs
          LLM_MAX_USD: "1.00"        # estimated cost a run may not exceed
          LLM_WAIT_MINUTES: "20"
          LLM_MAX_FETCH: "300"       # texts of older postings without a result, fetched once per run
          LLM_FULL_TEXT: "1"         # postings without task/requirement headings go in whole
        run: python -m radar.extract_llm 2>&1 | tee -a "$LOG"

      # Which postings were online today, as stretches in data/history/*.csv;
      # also writes docs/data/timeline.json and data/history.sqlite (not committed).
      - name: Update posting history
        run: python -m radar.history 2>&1 | tee -a "$LOG"

      # Posting volume vs. the last 7 days, API fields, pay range. A failed
      # check stops the run before anything is committed (and opens the issue).
      - name: Check data quality
        run: python -m radar.checks 2>&1 | tee -a "$LOG"

      - name: Build aggregates
        run: python -m radar.build 2>&1 | tee -a "$LOG"

      # Werkstudent jobs in Berlin and München from company career pages, read
      # through their ATS job-board APIs (data/companies.yaml). A board that
      # can't be read is a warning in the run summary, not a failed run.
      - name: Read company career pages
        continue-on-error: true
        run: python -m radar.careers 2>&1 | tee -a "$LOG"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv data/history.csv data/history docs/data docs/feeds
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          as_of=$(python -c "import json; print(json.load(open('docs/data/summary.json'))['as_of'])")
          git commit -m "Update data for ${as_of}"
          git pull --rebase origin main
          git push

      # Today's new postings as one signed POST to the n8n workflow that posts them
      # to Telegram. Only after the data is saved, so the catch-up run can't send the
      # same day twice. Does nothing without the two secrets and never fails the run.
      - name: Send Telegram alerts
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python -m radar.notify 2>&1 | tee -a "$LOG"

      - name: Report failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const title = 'Daily data update failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let log = '';
            try {
              log = fs.readFileSync(process.env.LOG, 'utf8').trim().split('\n').slice(-40).join('\n');
            } catch (e) {
              log = '(no pipeline log; the run failed before the pipeline started)';
            }
            const body = [
              `The run on ${new Date().toISOString().slice(0, 10)} failed: ${run}`,
              '',
              'Last lines of the log:',
              '```',
              log,
              '```',
              '',
              'Common causes: the Bundesagentur API changed (new version, 403 on an old path), ',
              'it was temporarily down, or a data check failed (posting count far from the ',
              '7-day median, API fields missing, pay out of range; see the run summary).',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Close failure issue after a successful run
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            for (const issue of open.filter(i => i.title === 'Daily data update failed')) {
              const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Recovered: ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }

  # Pushes made with GITHUB_TOKEN don't trigger other workflows or Pages builds,
  # so publish the updated site from here.
  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
